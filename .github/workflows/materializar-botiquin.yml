name: Materializar Botiquín 3D

on:
  push:
    branches:
      - fix/botiquin-integracion-real
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materializar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir paquete preparado
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import string

          partes = sorted(Path('scripts').glob('.botiquin-archive-*.part'))
          if not partes:
              raise SystemExit('No se encontraron partes del paquete del botiquín.')

          bruto = ''.join(parte.read_text(encoding='utf-8') for parte in partes)
          compacto = ''.join(bruto.split())
          alfabeto = set(string.ascii_letters + string.digits + '+/=')
          invalidos = [(i, ord(caracter)) for i, caracter in enumerate(compacto) if caracter not in alfabeto]
          print('Partes:', [(p.name, p.stat().st_size) for p in partes])
          print('Longitud compacta:', len(compacto), 'resto:', len(compacto) % 4)
          print('Caracteres fuera de base64:', invalidos[:20], 'total:', len(invalidos))

          limpio = ''.join(caracter for caracter in compacto if caracter in alfabeto)
          limpio += '=' * (-len(limpio) % 4)
          comprimido = base64.b64decode(limpio, validate=False)
          print('Bytes decodificados:', len(comprimido), 'cabecera:', comprimido[:4].hex())
          if comprimido[:2] != b'\x1f\x8b':
              raise SystemExit('El paquete reconstruido no comienza con una cabecera gzip.')
          gzip.decompress(comprimido)
          Path('/tmp/botiquin.tar.gz').write_bytes(comprimido)
          PY
          echo "Contenido del paquete:"
          tar -tzf /tmp/botiquin.tar.gz
          tar -xzf /tmp/botiquin.tar.gz -C .
          rm -f scripts/.botiquin-archive-*.part scripts/.botiquin-payload-*.b64

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar producción
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: prueba-local
          VITE_FIREBASE_AUTH_DOMAIN: ptem-a304f.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ptem-a304f
          VITE_FIREBASE_STORAGE_BUCKET: ptem-a304f.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:prueba'

      - name: Confirmar archivos materializados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "El paquete no produjo cambios."
            exit 1
          fi
          git commit -m "feat(botiquin): materializa la experiencia 3D interactiva"
          git push origin HEAD:fix/botiquin-integracion-real
