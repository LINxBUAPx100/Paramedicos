name: Materializar Botiquín 3D

on:
  push:
    branches:
      - fix/botiquin-integracion-real
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materializar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir paquete preparado
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/.botiquin-archive-00.part
          cat scripts/.botiquin-archive-*.part | tr -d '\r\n ' > /tmp/botiquin.b64
          base64 --decode /tmp/botiquin.b64 > /tmp/botiquin.tar.gz
          echo "Contenido del paquete:"
          tar -tzf /tmp/botiquin.tar.gz
          tar -xzf /tmp/botiquin.tar.gz -C .
          rm -f scripts/.botiquin-archive-*.part scripts/.botiquin-payload-*.b64

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar producción
        run: npm run build

      - name: Confirmar archivos materializados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "El paquete no produjo cambios."
            exit 1
          fi
          git commit -m "feat(botiquin): materializa la experiencia 3D interactiva"
          git push origin HEAD:fix/botiquin-integracion-real
