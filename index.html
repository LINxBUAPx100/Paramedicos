<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16181d" />
    <meta
      name="description"
      content="PTEM — Plataforma de estudio de Atención Prehospitalaria, Cuidados Críticos y Transición a Medicina. Comprende el porqué, no solo memorices."
    />
    <link rel="canonical" href="https://linxbuapx100.github.io/Paramedicos/" />

    <!-- Open Graph (previsualización al compartir en WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PTEM" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="https://linxbuapx100.github.io/Paramedicos/" />
    <meta property="og:title" content="PTEM — Técnico en Urgencias Médicas" />
    <meta
      property="og:description"
      content="Estudia Atención Prehospitalaria y Cuidados Críticos comprendiendo el porqué: teoría, fisiología, farmacología y correlación clínica."
    />
    <meta property="og:image" content="https://linxbuapx100.github.io/Paramedicos/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PTEM — Técnico en Urgencias Médicas" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PTEM — Técnico en Urgencias Médicas" />
    <meta
      name="twitter:description"
      content="Estudia Atención Prehospitalaria y Cuidados Críticos comprendiendo el porqué, no solo memorizando."
    />
    <meta name="twitter:image" content="https://linxbuapx100.github.io/Paramedicos/og-image.jpg" />
    <!-- Las tipografías ya no vienen de Google: van auto-alojadas y las carga
         src/index.css (@fontsource). De ahí que aquí no quede ni preconnect ni
         stylesheet externo. -->
    <!-- CDNs de imágenes: adelanta la conexión para que rendericen antes -->
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    <link rel="dns-prefetch" href="https://wsrv.nl" />
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />
    <!-- Hero (LCP): la foto a sangre de la portada general.
         Hasta el 31-08-2026 aquí se precargaba la ilustración del paramédico.
         Dejó de ser lo correcto cuando `/` pasó a ser la portada general de
         PTEM: el paramédico ya no se pinta en la raíz, así que era una descarga
         en prioridad alta que competía justo con la foto que sí es el LCP.

         Se precarga UNA sola, y es la de la raíz: `/` es la dirección canónica,
         la que apunta el Open Graph y por la que entra todo el mundo.
         `/paramedicos` conserva su ilustración con `fetchpriority="high"` en su
         propio <img> (ver src/pages/Home.jsx); pierde la ventaja de salida del
         analizador de cabecera, y es el precio de no cargar las dos.

         POR QUÉ NO SE ELIGE POR RUTA: el enrutado va por hash, así que la ruta
         sí se conoce aquí, pero elegir exige un <script> en línea y la CSP del
         build lo prohíbe a propósito (`script-src 'self'`, ver vite.config.js).
         Abrir 'unsafe-inline' por un preload sería cambiar una defensa real por
         unos milisegundos. Cuando llegue F1 (dominio propio y BrowserRouter),
         cada ruta podrá llevar su <link> y esto se resuelve solo. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="./portada/portada-fondo-1600.avif"
      imagesrcset="./portada/portada-fondo-800.avif 800w, ./portada/portada-fondo-1200.avif 1200w, ./portada/portada-fondo-1600.avif 1600w, ./portada/portada-fondo-2000.avif 2000w, ./portada/portada-fondo-2560.avif 2560w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <title>PTEM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
