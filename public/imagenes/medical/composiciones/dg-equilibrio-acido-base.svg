="76" y="336" class="t-caja">pH ↓ · PaCO₂ ↑ · HCO₃⁻ normal</text><text x="76" y="361" class="t-caja">No ventila bien: retiene CO₂.</text><text x="76" y="378" class="t-caja">Depresión del centro respiratorio, EPOC,</text><text x="76" y="395" class="t-caja">obstrucción, tórax inestable.</text><text x="76" y="420" class="t-caja">Compensa el riñón: retiene HCO₃⁻ (días).</text><rect width="409" height="155" x="491" y="292" class="caja" rx="10"/><rect width="4" height="155" x="491" y="292" class="tono-acento" rx="2"/><text x="507" y="316" class="t-caja-tit tono-acento">Alcalosis respiratoria</text><text x="507" y="336" class="t-caja">pH ↑ · PaCO₂ ↓ · HCO₃⁻ normal</text><text x="507" y="361" class="t-caja">Hiperventila: lava el CO₂.</text><text x="507" y="378" class="t-caja">Ansiedad, dolor, fiebre, altura,</text><text x="507" y="395" class="t-caja">ventilación mecánica excesiva.</text><text x="507" y="420" class="t-caja">Compensa el riñón: elimina HCO₃⁻.</text><rect width="409" height="155" x="60" y="469" class="caja" rx="10"/><rect width="4" height="155" x="60" y="469" class="tono-ambar" rx="2"/><text x="76" y="493" class="t-caja-tit tono-ambar">Acidosis metabólica</text><text x="76" y="513" class="t-caja">pH ↓ · HCO₃⁻ ↓ · PaCO₂ normal</text><text x="76" y="538" class="t-caja">Se acumula ácido o se pierde base.</text><text x="76" y="555" class="t-caja">Shock (láctico), cetoacidosis,</text><text x="76" y="572" class="t-caja">insuficiencia renal, diarrea.</text><text x="76" y="597" class="t-caja">Compensa el pulmón: hiperventila (minutos).</text><rect width="409" height="155" x="491" y="469" class="caja" rx="10"/><rect width="4" height="155" x="491" y="469" class="tono-violeta" rx="2"/><text x="507" y="493" class="t-caja-tit tono-violeta">Alcalosis metabólica</text><text x="507" y="513" class="t-caja">pH ↑ · HCO₃⁻ ↑ · PaCO₂ normal</text><text x="507" y="538" class="t-caja">Se pierde ácido o sobra base.</text><text x="507" y="555" class="t-caja">Vómito prolongado, aspiración</text><text x="507" y="572" class="t-caja">gástrica, diuréticos.</text><text x="507" y="597" class="t-caja">Compensa el pulmón: hipoventila.</text><text x="344" y="132" class="t-etq tono-acento" style="font-size:15px;font-weight:700" text-anchor="end">PaCO₂</text><text x="344" y="152" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="end">manda el pulmón</text><text x="616" y="132" class="t-etq" style="fill:var(--ok);font-size:15px;font-weight:700">HCO₃⁻</text><text x="616" y="152" class="t-etq tono-suave" style="font-size:11.5px">manda el riñón</text><text x="300" y="268" class="t-etq tono-alerta" style="font-size:14.5px;font-weight:700" text-anchor="middle">ACIDOSIS · pH &lt; 7,35</text><text x="660" y="268" class="t-etq tono-acento" style="font-size:14.5px;font-weight:700" text-anchor="middle">ALCALOSIS · pH &gt; 7,45</text><path d="M60 644h840" class="regla"/><text x="60" y="666" class="t-nota">Regla de lectura: mira el pH para saber de qué lado está; luego busca si el que se movió en la misma dirección es la PaCO₂</text><text x="60" y="682" class="t-nota">(respiratorio) o el HCO₃⁻ (metabólico).</text></svg>