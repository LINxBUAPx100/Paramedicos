<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" style="--f:#ffffff;--p:#f1f5f9;--b:#cbd5e1;--t:#0f172a;--s:#475569;--ac:#0369a1;--al:#b91c1c;--ok:#047857;--am:#8f5700;--vi:#6d28d9" viewBox="0 0 960 700"><title>Equilibrio ácido-base</title><desc>La balanza representa el equilibrio entre los dos platillos que fijan el pH: la PaCO₂, que controla el pulmón, y el bicarbonato, que controla el riñón. Debajo, cuatro fichas describen los cuatro trastornos. Acidosis respiratoria: pH bajo, PaCO₂ alta, bicarbonato normal; el paciente no ventila bien y retiene dióxido de carbono, por depresión del centro respiratorio, EPOC, obstrucción o tórax inestable; compensa el riñón reteniendo bicarbonato en días. Alcalosis respiratoria: pH alto, PaCO₂ baja, bicarbonato normal; hiperventila y lava el dióxido de carbono, por ansiedad, dolor, fiebre, altura o ventilación mecánica excesiva; compensa el riñón eliminando bicarbonato. Acidosis metabólica: pH bajo, bicarbonato bajo, PaCO₂ normal; se acumula ácido o se pierde base, en shock por lactato, cetoacidosis, insuficiencia renal o diarrea; compensa el pulmón hiperventilando en minutos. Alcalosis metabólica: pH alto, bicarbonato alto, PaCO₂ normal; se pierde ácido o sobra base, por vómito prolongado, aspiración gástrica o diuréticos; compensa el pulmón hipoventilando.</desc><defs><marker id="punta" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="context-stroke" d="m0 0 10 5-10 5z"/></marker><style>@media (prefers-color-scheme:dark){:root{--f:#0b1220;--p:#16202f;--b:#334155;--t:#e2e8f0;--s:#94a3b8;--ac:#38bdf8;--al:#f87171;--ok:#34d399;--am:#fbbf24;--vi:#a78bfa}}.t-caja,.t-caja-tit,.t-etq,.t-nota{font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.t-caja-tit{font-size:14.5px;font-weight:700}.t-caja,.t-nota{font-size:12.8px;fill:var(--t)}.t-nota{fill:var(--s)}.t-etq{font-size:12.5px;fill:var(--t)}.caja{fill:var(--p);rx:10}.caja,.regla{stroke:var(--b);stroke-width:1}.tono-suave{fill:var(--s)}.tono-acento{fill:var(--ac)}.tono-alerta{fill:var(--al)}.tono-ambar{fill:var(--am)}.tono-violeta{fill:var(--vi)}</style></defs><path d="M0 0h960v700H0z" style="fill:var(--f)"/><text x="60" y="48" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:26px;font-weight:700;fill:var(--t)">Equilibrio ácido-base</text><text x="60" y="72" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:14.5px;fill:var(--s)">pH normal 7,35–7,45 · PaCO₂ 35–45 mmHg · HCO₃⁻ 22–26 mEq/L</text><path d="M60 84h840" class="regla"/><svg width="180" height="130" x="390" y="100" viewBox="0 0 172.573 208.781"><defs><clipPath id="k1-a" clipPathUnits="userSpaceOnUse"><path d="M1.6-.4h172.38v208.91H1.6z"/></clipPath></defs><path fill="#feedb4" fill-rule="evenodd" d="M10.03 184.61c0-8.36 34.9-15.15 77.87-15.15 43.01 0 77.87 6.79 77.87 15.15 0 8.39-34.86 15.15-77.87 15.15-42.97 0-77.87-6.75-77.87-15.15"/><path fill="#fff" fill-rule="evenodd" d="M89.67 198.08c37.42-.32 72.6-6.64 72.6-13.95 0-5-16.19-8.63-37.06-10.99 38.02 5.68 49.21 18.63-35.54 24.95z" clip-path="url(#k1-a)"/><path fill="#fedf77" fill-rule="evenodd" d="M165.78 192.48c0 8.31-34.94 14.95-77.99 14.95-43.09 0-77.75-6.64-77.75-14.95v-8c0 8.31 34.66 15.31 77.75 15.31 43.05 0 77.99-7 77.99-15.31z"/><path fill="#6faabb" fill-rule="evenodd" d="M10.35 124.33c0-2.32 12.67-4.2 28.26-4.2 15.61 0 28.26 1.88 28.26 4.2s-12.65 4.2-28.26 4.2c-15.59 0-28.26-1.88-28.26-4.2m98.26 0c0-2.32 12.67-4.2 28.26-4.2 15.63 0 28.26 1.88 28.26 4.2s-12.63 4.2-28.26 4.2c-15.59 0-28.26-1.88-28.26-4.2"/><path fill="#fede77" fill-rule="evenodd" d="M85.03 16.19v21.35h5.84V16.19z"/><path fill="#feeeb6" fill-rule="evenodd" d="M80.15 11.55v4.64h15.03v-4.64zm0 25.99v4.32h15.03v-4.32z"/><path fill="#feedb4" fill-rule="evenodd" d="M61.52 173.5c0-2.76 11.75-5 26.22-5 14.51 0 26.22 2.24 26.22 5 0 2.8-11.71 5-26.22 5-14.47 0-26.