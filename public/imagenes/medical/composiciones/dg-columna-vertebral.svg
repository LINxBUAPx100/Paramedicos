<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" width="960" height="604" role="img"><title>Columna vertebral</title><desc>A la izquierda, un esquema de la columna dividido en sus cinco regiones, de arriba abajo: siete vértebras cervicales, doce dorsales o torácicas, cinco lumbares, el sacro y el cóccix. A la derecha, cinco fichas describen cada región: la cervical es la más móvil y la más expuesta en trauma, y por encima de C5 se compromete el diafragma; la dorsal se articula con las costillas y es la más estable; la lumbar soporta el peso del tronco; el sacro forma parte del anillo pelviano; y el cóccix es el resto vertebral final.</desc><defs><style>:root{--f:#ffffff; --p:#f1f5f9; --b:#cbd5e1; --t:#0f172a; --s:#475569;--ac:#0369a1; --al:#b91c1c; --ok:#047857; --am:#8f5700; --vi:#6d28d9;}@media (prefers-color-scheme: dark){:root{--f:#0b1220; --p:#16202f; --b:#334155; --t:#e2e8f0; --s:#94a3b8;--ac:#38bdf8; --al:#f87171; --ok:#34d399; --am:#fbbf24; --vi:#a78bfa;}}.fondo{fill:var(--f)}.t-titulo{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:26px;font-weight:700;fill:var(--t)}.t-sub{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;fill:var(--s)}.t-caja-tit{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;font-weight:700}.t-caja{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.8px;fill:var(--t)}.t-pie{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:var(--s)}.t-nota{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.8px;fill:var(--s)}.t-etq{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:var(--t)}.t-formula{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:700;fill:var(--t)}.t-formula-nota{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:var(--s)}.caja{fill:var(--p);stroke:var(--b);stroke-width:1;rx:10}.regla{stroke:var(--b);stroke-width:1}.tono-tinta{fill:var(--t)} .tono-suave{fill:var(--s)} .tono-acento{fill:var(--ac)}.tono-alerta{fill:var(--al)} .tono-ok{fill:var(--ok)} .tono-ambar{fill:var(--am)}.tono-violeta{fill:var(--vi)}.bd-tinta{stroke:var(--t)} .bd-suave{stroke:var(--s)} .bd-acento{stroke:var(--ac)}.bd-alerta{stroke:var(--al)} .bd-ok{stroke:var(--ok)} .bd-ambar{stroke:var(--am)}.bd-violeta{stroke:var(--vi)} .bd-borde{stroke:var(--b)}.fl-panel{fill:var(--p)} .fl-borde{fill:var(--b)} .fl-none{fill:none}.fl-tinta{fill:var(--t)} .fl-suave{fill:var(--s)} .fl-acento{fill:var(--ac)}.fl-alerta{fill:var(--al)} .fl-ok{fill:var(--ok)} .fl-ambar{fill:var(--am)}.fl-violeta{fill:var(--vi)}</style><marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect class="fondo" x="0" y="0" width="960" height="604"/><text class="t-titulo" x="60" y="48">Columna vertebral</text><text class="t-sub" x="60" y="72">Regiones, número de vértebras y qué protege cada tramo</text><line class="regla" x1="60" y1="84" x2="900" y2="84"/><path class="fl-alerta bd-alerta" fill-rule="evenodd" d="M150 108 H230 V196 H150 Z" stroke-width="1.2" fill-opacity="0.22"/><path class="fl-acento bd-acento" fill-rule="evenodd" d="M150 196 H230 V336 H150 Z" stroke-width="1.2" fill-opacity="0.22"/><path class="fl-ambar bd-ambar" fill-rule="evenodd" d="M150 336 H230 V420 H150 Z" stroke-width="1.2" fill-opacity="0.22"/><path class="fl-ok bd-ok" fill-rule="evenodd" d="M150 420 H230 V474 H150 Z" stroke-width="1.2" fill-opacity="0.22"/><path class="fl-suave bd-suave" fill-rule="evenodd" d="M150 474 H230 V506 H150 Z" stroke-width="1.2" fill-opacity="0.22"/><path class="fl-none bd-borde" fill-rule="evenodd" d="M190 108 V506" stroke-width="0.8" stroke-dasharray="5 4"/><path class="fl-none bd-alerta" fill-rule="evenodd" d="M238 152 h34" stroke-width="1.6" marker-end="url(#punta)"/><path class="fl-none bd-acento" fill-rule="evenodd" d="M238 266 h34" stroke-width="1.6" marker-end="url(#punta)"/><path class="fl-none bd-ambar" fill-rule="evenodd" d="M238 378 h34" stroke-width="1.6" marker-end="url(#punta)"/><path class="fl-none bd-ok" fill-rule="evenodd" d="M238 447 h34" stroke-width="1.6" marker-end="url(#punta)"/><path class="fl-none bd-suave" fill-rule="evenodd" d="M238 490 h34" stroke-width="1.6" marker-end="url(#punta)"/><rect class="caja" x="300" y="108" width="600" height="88" rx="10"/><rect class="tono-alerta" x="300" y="108" width="4" height="88" rx="2"/><text class="t-caja-tit tono-alerta" x="316" y="132">Cervical · 7 vértebras (C1–C7)</text><text class="t-caja" x="316" y="152">La región más móvil y la más expuesta en trauma. Por encima de C5</text><text class="t-caja" x="316" y="169">se compromete la inervación del diafragma y con ella la respiración.</text><rect class="caja" x="300" y="206" width="600" height="88" rx="10"/><rect class="tono-acento" x="300" y="206" width="4" height="88" rx="2"/><text class="t-caja-tit tono-acento" x="316" y="230">Dorsal o torácica · 12 vértebras (T1–T12)</text><text class="t-caja" x="316" y="250">Articulada con las costillas: es la más estable, y por eso una</text><text class="t-caja" x="316" y="267">lesión aquí implica que hubo mucha energía.</text><rect class="caja" x="300" y="304" width="600" height="72" rx="10"/><rect class="tono-ambar" x="300" y="304" width="4" height="72" rx="2"/><text class="t-caja-tit tono-ambar" x="316" y="328">Lumbar · 5 vértebras (L1–L5)</text><text class="t-caja" x="316" y="348">Soporta el peso del tronco; son las vértebras más grandes.</text><rect class="caja" x="300" y="386" width="600" height="72" rx="10"/><rect class="tono-ok" x="300" y="386" width="4" height="72" rx="2"/><text class="t-caja-tit tono-ok" x="316" y="410">Sacro · 5 vértebras soldadas</text><text class="t-caja" x="316" y="430">Forma parte del anillo pelviano y transmite el peso a la pelvis.</text><rect class="caja" x="300" y="468" width="600" height="72" rx="10"/><rect class="tono-suave" x="300" y="468" width="4" height="72" rx="2"/><text class="t-caja-tit tono-suave" x="316" y="492">Cóccix</text><text class="t-caja" x="316" y="512">Resto vertebral final, sin función de carga.</text><text class="t-etq tono-alerta" x="190" y="158" text-anchor="middle" style="font-size:14px;font-weight:700">C1–C7</text><text class="t-etq tono-acento" x="190" y="272" text-anchor="middle" style="font-size:14px;font-weight:700">T1–T12</text><text class="t-etq tono-ambar" x="190" y="384" text-anchor="middle" style="font-size:14px;font-weight:700">L1–L5</text><text class="t-etq tono-ok" x="190" y="453" text-anchor="middle" style="font-size:13px;font-weight:700">Sacro</text><text class="t-etq tono-suave" x="190" y="496" text-anchor="middle" style="font-size:12px;font-weight:700">Cóccix</text><text class="t-etq tono-suave" x="190" y="528" text-anchor="middle" style="font-size:12.5px">Esquema por regiones</text><text class="t-etq tono-suave" x="60" y="116" style="font-size:11.5px">arriba</text><text class="t-etq tono-suave" x="60" y="506" style="font-size:11.5px">abajo</text><line class="regla" x1="60" y1="548" x2="900" y2="548"/><text class="t-nota" x="60" y="570">La médula termina hacia L1–L2; por debajo el conducto contiene raíces (cauda equina), no médula. Por eso una lesión lumbar baja</text><text class="t-nota" x="60" y="586">produce un cuadro de raíces y no una sección medular.</text></svg>
