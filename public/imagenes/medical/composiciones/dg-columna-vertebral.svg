<svg xmlns="http://www.w3.org/2000/svg" width="960" height="604" style="--f:#ffffff;--p:#f1f5f9;--b:#cbd5e1;--t:#0f172a;--s:#475569;--ac:#0369a1;--al:#b91c1c;--ok:#047857;--am:#8f5700;--vi:#6d28d9" viewBox="0 0 960 604"><title>Columna vertebral</title><desc>A la izquierda, un esquema de la columna dividido en sus cinco regiones, de arriba abajo: siete vértebras cervicales, doce dorsales o torácicas, cinco lumbares, el sacro y el cóccix. A la derecha, cinco fichas describen cada región: la cervical es la más móvil y la más expuesta en trauma, y por encima de C5 se compromete el diafragma; la dorsal se articula con las costillas y es la más estable; la lumbar soporta el peso del tronco; el sacro forma parte del anillo pelviano; y el cóccix es el resto vertebral final.</desc><defs><marker id="punta" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="context-stroke" d="m0 0 10 5-10 5z"/></marker><style>@media (prefers-color-scheme:dark){:root{--f:#0b1220;--p:#16202f;--b:#334155;--t:#e2e8f0;--s:#94a3b8;--ac:#38bdf8;--al:#f87171;--ok:#34d399;--am:#fbbf24;--vi:#a78bfa}}.t-caja,.t-caja-tit,.t-etq,.t-nota{font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.t-caja-tit{font-size:14.5px;font-weight:700}.t-caja,.t-nota{font-size:12.8px;fill:var(--t)}.t-nota{fill:var(--s)}.t-etq{font-size:12.5px;fill:var(--t)}.caja{fill:var(--p);rx:10}.caja,.regla{stroke:var(--b);stroke-width:1}.tono-suave{fill:var(--s)}.tono-acento{fill:var(--ac)}.tono-alerta{fill:var(--al)}.tono-ok{fill:var(--ok)}.tono-ambar{fill:var(--am)}.bd-suave{stroke:var(--s)}.bd-acento{stroke:var(--ac)}.bd-alerta{stroke:var(--al)}.bd-ok{stroke:var(--ok)}.bd-ambar{stroke:var(--am)}.fl-none{fill:none}</style></defs><path d="M0 0h960v604H0z" style="fill:var(--f)"/><text x="60" y="48" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:26px;font-weight:700;fill:var(--t)">Columna vertebral</text><text x="60" y="72" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:14.5px;fill:var(--s)">Regiones, número de vértebras y qué protege cada tramo</text><path d="M60 84h840" class="regla"/><path fill-opacity=".22" fill-rule="evenodd" stroke-width="1.2" d="M150 108h80v88h-80Z" class="bd-alerta" style="fill:var(--al)"/><path fill-opacity=".22" fill-rule="evenodd" stroke-width="1.2" d="M150 196h80v140h-80Z" class="bd-acento" style="fill:var(--ac)"/><path fill-opacity=".22" fill-rule="evenodd" stroke-width="1.2" d="M150 336h80v84h-80Z" class="bd-ambar" style="fill:var(--am)"/><path fill-opacity=".22" fill-rule="evenodd" stroke-width="1.2" d="M150 420h80v54h-80Z" class="bd-ok" style="fill:var(--ok)"/><path fill-opacity=".22" fill-rule="evenodd" stroke-width="1.2" d="M150 474h80v32h-80Z" class="bd-suave" style="fill:var(--s)"/><path fill-rule="evenodd" stroke-dasharray="5 4" stroke-width=".8" d="M190 108v398" class="fl-none" style="stroke:var(--b)"/><path fill-rule="evenodd" stroke-width="1.6" marker-end="url(#punta)" d="M238 152h34" class="fl-none bd-alerta"/><path fill-rule="evenodd" stroke-width="1.6" marker-end="url(#punta)" d="M238 266h34" class="fl-none bd-acento"/><path fill-rule="evenodd" stroke-width="1.6" marker-end="url(#punta)" d="M238 378h34" class="fl-none bd-ambar"/><path fill-rule="evenodd" stroke-width="1.6" marker-end="url(#punta)" d="M238 447h34" class="fl-none bd-ok"/><path fill-rule="evenodd" stroke-width="1.6" marker-end="url(#punta)" d="M238 490h34" class="fl-none bd-suave"/><rect width="600" height="88" x="300" y="108" class="caja" rx="10"/><rect width="4" height="88" x="300" y="108" class="tono-alerta" rx="2"/><text x="316" y="132" class="t-caja-tit tono-alerta">Cervical · 7 vértebras (C1–C7)</text><text x="316" y="152" class="t-caja">La región más móvil y la más expuesta en trauma. Por encima de C5</text><text x="316" y="169" class="t-caja">se compromete la inervación del diafragma y con ella la respiración.</text><rect width="600" height="88" x="300" y="206" class="caja" rx="10"/><rect width="4" height="88" x="300" y="206" class="tono-acento" rx="2"/><text x="316" y="230" class="t-caja-tit tono-acento">Dorsal o torácica · 12 vértebras (T1–T12)</text><text x="316" y="250" class="t-caja">Articulada con las costillas: es la más estable, y por eso una</text><text x="316" y="267" class="t-caja">lesión aquí implica que hubo mucha energía.</text><rect width="600" height="72" x="300" y="304" class="caja" rx="10"/><rect width="4" height="72" x="300" y="304" class="tono-ambar" rx="2"/><text x="316" y="328" class="t-caja-tit tono-ambar">Lumbar · 5 vértebras (L1–L5)</text><text x="316" y="348" class="t-caja">Soporta el peso del tronco; son las vértebras más grandes.</text><rect width="600" height="72" x="300" y="386" class="caja" rx="10"/><rect width="4" height="72" x="300" y="386" class="tono-ok" rx="2"/><text x="316" y="410" class="t-caja-tit tono-ok">Sacro · 5 vértebras soldadas</text><text x="316" y="430" class="t-caja">Forma parte del anillo pelviano y transmite el peso a la pelvis.</text><rect width="600" height="72" x="300" y="468" class="caja" rx="10"/><rect width="4" height="72" x="300" y="468" class="tono-suave" rx="2"/><text x="316" y="492" class="t-caja-tit tono-suave">Cóccix</text><text x="316" y="512" class="t-caja">Resto vertebral final, sin función de carga.</text><text x="190" y="158" class="t-etq tono-alerta" style="font-size:14px;font-weight:700" text-anchor="middle">C1–C7</text><text x="190" y="272" class="t-etq tono-acento" style="font-size:14px;font-weight:700" text-anchor="middle">T1–T12</text><text x="190" y="384" class="t-etq tono-ambar" style="font-size:14px;font-weight:700" text-anchor="middle">L1–L5</text><text x="190" y="453" class="t-etq tono-ok" style="font-size:13px;font-weight:700" text-anchor="middle">Sacro</text><text x="190" y="496" class="t-etq tono-suave" style="font-size:12px;font-weight:700" text-anchor="middle">Cóccix</text><text x="190" y="528" class="t-etq tono-suave" style="font-size:12.5px" text-anchor="middle">Esquema por regiones</text><text x="60" y="116" class="t-etq tono-suave" style="font-size:11.5px">arriba</text><text x="60" y="506" class="t-etq tono-suave" style="font-size:11.5px">abajo</text><path d="M60 548h840" class="regla"/><text x="60" y="570" class="t-nota">La médula termina hacia L1–L2; por debajo el conducto contiene raíces (cauda equina), no médula. Por eso una lesión lumbar baja</text><text x="60" y="586" class="t-nota">produce un cuadro de raíces y no una sección medular.</text></svg>