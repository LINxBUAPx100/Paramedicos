<svg xmlns="http://www.w3.org/2000/svg" width="960" height="628" style="--f:#ffffff;--p:#f1f5f9;--b:#cbd5e1;--t:#0f172a;--s:#475569;--ac:#0369a1;--al:#b91c1c;--ok:#047857;--am:#8f5700;--vi:#6d28d9" viewBox="0 0 960 628"><title>Onda electrocardiográfica normal</title><desc>Arriba, un trazo electrocardiográfico sobre la cuadrícula del papel de registro. Debajo, seis fichas identifican cada elemento del ciclo: onda P como despolarización auricular, complejo QRS como despolarización ventricular con duración menor de 0,12 segundos, onda T como repolarización ventricular, segmento ST como referencia isoeléctrica cuyo desplazamiento orienta a lesión o isquemia, intervalo PR de 0,12 a 0,20 segundos e intervalo QT variable con la frecuencia.</desc><defs><marker id="punta" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="context-stroke" d="m0 0 10 5-10 5z"/></marker><style>@media (prefers-color-scheme:dark){:root{--f:#0b1220;--p:#16202f;--b:#334155;--t:#e2e8f0;--s:#94a3b8;--ac:#38bdf8;--al:#f87171;--ok:#34d399;--am:#fbbf24;--vi:#a78bfa}}.t-caja,.t-caja-tit,.t-nota{font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.t-caja-tit{font-size:14.5px;font-weight:700}.t-caja,.t-nota{font-size:12.8px;fill:var(--t)}.t-nota{fill:var(--s)}.caja{fill:var(--p);rx:10}.caja,.regla{stroke:var(--b);stroke-width:1}.tono-suave{fill:var(--s)}.tono-acento{fill:var(--ac)}.tono-alerta{fill:var(--al)}.tono-ok{fill:var(--ok)}.tono-ambar{fill:var(--am)}.tono-violeta{fill:var(--vi)}</style></defs><path d="M0 0h960v628H0z" style="fill:var(--f)"/><text x="60" y="48" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:26px;font-weight:700;fill:var(--t)">Onda electrocardiográfica normal</text><text x="60" y="72" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:14.5px;fill:var(--s)">Papel a 25 mm/s · cuadro grande = 0,20 s · cuadro chico = 0,04 s</text><path d="M60 84h840" class="regla"/><svg width="840" height="190" x="60" y="100" viewBox="0 0 145.471 91.05"><defs><clipPath id="k1-a" clipPathUnits="userSpaceOnUse"><path d="M-11.91-10.15h563.66v367.94H-11.91z"/></clipPath></defs><path fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-width=".011" d="M118.2 58.53v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v1.48h-.28v-1.48z"/><path fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-width=".005" d="M38.88 56.14v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v.57h-.28v-.57z"/><path fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-width=".011" d="M99.44 58.79v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v1.48h-.28v-1.48zM77.48 59.06v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v1.48h-.28v-1.48z"/><path fill="none" stroke="#58d3f4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.358" d="M85.67 218.87h61.76s8-42.57 19.71-42.57 15.43 39.74 15.43 39.74h31.94l8 47.69 28.74-233.94 30.38 240.73 10.11-43.69h86.23s22.91-67.56 28.22-69.28c5.32-2.28 12.23 0 12.23 0s9.6 11.91 26.62 68.72h5.32s12.27-14.19 25.59-14.19c13.31 0 22.87 14.19 22.87 14.19h50.57" clip-path="url(#k1-a)" transform="translate(-.332 -1.459)scale(.26458)"/><text xml:space="preserve" font-family="Arial" font-size="26.625" font-weight="700" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(63.754 5.043)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#87dbf5" dx="0" dy="0">R</tspan></tspan></text><text xml:space="preserve" font-family="Arial" font-size="26.625" font-weight="700" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(57.143 75.115)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#87dbf5" dx="0" dy="0">Q</tspan></tspan></text><text xml:space="preserve" font-family="Arial" font-size="26.625" font-weight="700" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(106.326 38.096)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#87dbf5" dx="0" dy="0">T</tspan></tspan></text><text xml:space="preserve" font-family="Arial" font-size="26.625" font-weight="700" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(122.984 52.903)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#87dbf5" dx="0" dy="0">U</tspan></tspan></text><path fill="#2d2d2d" stroke="#fff" stroke-linejoin="round" stroke-width=".005" d="M9.92 2.65v64.17h-.53V2.65zM8.6 3 9.65.89l1.06 2.12zm2.12 63.46-1.06 2.12-1.06-2.12z"/><text xml:space="preserve" font-family="Arial" font-size="26.625" font-weight="700" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(41.542 43.648)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#87dbf5" dx="0" dy="0">P</tspan></tspan></text><text xml:space="preserve" font-family="Arial" font-size="26.625" font-weight="700" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(70.364 76.966)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#87dbf5" dx="0" dy="0">S</tspan></tspan></text><text xml:space="preserve" fill="#2d2d2d" font-family="Arial" font-size="18.625" font-weight="400" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(-.325 4.842)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0">mV</tspan></tspan></text><text xml:space="preserve" fill="#2d2d2d" font-family="Arial" font-size="32" font-weight="400" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(10.693 13.249)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0">+</tspan></tspan></text><text xml:space="preserve" fill="#2d2d2d" font-family="Arial" font-size="32" font-weight="400" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(11.133 63.797)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0">-</tspan></tspan></text><path fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-width=".005" d="M48.14 56.14v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v.57h-.28v-.57z"/><text xml:space="preserve" font-family="Arial" font-size="18.625" font-weight="400" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(41.807 80.731)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#f3db63" dx="0" dy="0">P</tspan></tspan></text><path fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-width=".005" d="M56.07 56.14v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v2.2h-.28v-2.2zm0 3.02v.57h-.28v-.57z"/><path fill="#f3db63" stroke="#f3db63" stroke-linejoin="round" stroke-width=".011" d="M57.96 81.89h17.63v.35H57.96zm.35 1.23-2.12-1.06L58.31 81zM75.23 81l2.12 1.06-2.12 1.06z"/><text xml:space="preserve" font-family="Arial" font-size="18.625" font-weight="400" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(60.845 81.26)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#f3db63" dx="0" dy="0">QRS</tspan></tspan></text><path fill="#f4a404" stroke="#f4a404" stroke-linejoin="round" stroke-width=".011" d="M79.64 89.56h17.63v.35H79.64zm.35 1.23-2.12-1.06 2.12-1.06zm16.92-2.12 2.12 1.06-2.12 1.06z"/><text xml:space="preserve" font-family="Arial" font-size="18.625" font-weight="400" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(85.436 88.928)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#f4a404" dx="0" dy="0">ST</tspan></tspan></text><path fill="#f3db63" stroke="#f3db63" stroke-linejoin="round" stroke-width=".011" d="M100.79 81.63h15.52v.35h-15.52zm.35 1.23-2.12-1.06 2.12-1.06zm14.81-2.12 2.12 1.06-2.12 1.06z"/><text xml:space="preserve" font-family="Arial" font-size="18.625" font-weight="400" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(107.207 80.996)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#f3db63" dx="0" dy="0">T</tspan></tspan></text><text xml:space="preserve" font-family="Arial" font-size="18.625" font-weight="400" letter-spacing="0" style="line-height:125%;text-align:start" transform="translate(45.068 88.708)scale(.26458)" word-spacing="0"><tspan x="0" y="0"><tspan fill="#f4a404" dx="0" dy="0">PQ</tspan></tspan></text><path fill="#f4a404" stroke="#f4a404" stroke-linejoin="round" stroke-width=".005" d="M40.78 89.81h13.4v.35h-13.4zm.35 1.23-2.12-1.06 2.12-1.06zm12.69-2.12 2.12 1.06-2.12 1.06z"/></svg><text x="480" y="308" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:12.5px;fill:var(--s)" text-anchor="middle">Trazo sobre el papel de registro</text><rect width="268" height="105" x="60" y="336" class="caja" rx="10"/><rect width="4" height="105" x="60" y="336" class="tono-acento" rx="2"/><text x="76" y="360" class="t-caja-tit tono-acento">Onda P</text><text x="76" y="380" class="t-caja">Despolarización auricular.</text><text x="76" y="397" class="t-caja">Precede a cada QRS cuando</text><text x="76" y="414" class="t-caja">el ritmo nace en el nodo SA.</text><rect width="268" height="105" x="346" y="336" class="caja" rx="10"/><rect width="4" height="105" x="346" y="336" class="tono-alerta" rx="2"/><text x="362" y="360" class="t-caja-tit tono-alerta">Complejo QRS</text><text x="362" y="380" class="t-caja">Despolarización ventricular.</text><text x="362" y="397" class="t-caja">Dura menos de 0,12 s si baja</text><text x="362" y="414" class="t-caja">por el sistema de conducción.</text><rect width="268" height="105" x="632" y="336" class="caja" rx="10"/><rect width="4" height="105" x="632" y="336" class="tono-violeta" rx="2"/><text x="648" y="360" class="t-caja-tit tono-violeta">Onda T</text><text x="648" y="380" class="t-caja">Repolarización ventricular.</text><text x="648" y="397" class="t-caja">Cambia de forma con la</text><text x="648" y="414" class="t-caja">isquemia y con el potasio.</text><rect width="268" height="105" x="60" y="459" class="caja" rx="10"/><rect width="4" height="105" x="60" y="459" class="tono-ambar" rx="2"/><text x="76" y="483" class="t-caja-tit tono-ambar">Segmento ST</text><text x="76" y="503" class="t-caja">Referencia isoeléctrica. Su</text><text x="76" y="520" class="t-caja">elevación o descenso orienta</text><text x="76" y="537" class="t-caja">a lesión o isquemia.</text><rect width="268" height="105" x="346" y="459" class="caja" rx="10"/><rect width="4" height="105" x="346" y="459" class="tono-ok" rx="2"/><text x="362" y="483" class="t-caja-tit tono-ok">Intervalo PR</text><text x="362" y="503" class="t-caja">0,12–0,20 s. Es el retraso</text><text x="362" y="520" class="t-caja">que introduce el nodo AV.</text><rect width="268" height="105" x="632" y="459" class="caja" rx="10"/><rect width="4" height="105" x="632" y="459" class="tono-suave" rx="2"/><text x="648" y="483" class="t-caja-tit tono-suave">Intervalo QT</text><text x="648" y="503" class="t-caja">Varía con la frecuencia; se</text><text x="648" y="520" class="t-caja">corrige antes de interpretarlo.</text><path d="M60 572h840" class="regla"/><text x="60" y="594" class="t-nota">El trazo se lee siempre en el mismo orden: ¿hay onda P?, ¿cada P lleva su QRS?, ¿el QRS es estrecho?, ¿el intervalo es regular? Solo</text><text x="60" y="610" class="t-nota">después se busca la alteración.</text></svg>