<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" width="960" height="628" role="img"><title>Onda electrocardiográfica normal</title><desc>Arriba, un trazo electrocardiográfico sobre la cuadrícula del papel de registro. Debajo, seis fichas identifican cada elemento del ciclo: onda P como despolarización auricular, complejo QRS como despolarización ventricular con duración menor de 0,12 segundos, onda T como repolarización ventricular, segmento ST como referencia isoeléctrica cuyo desplazamiento orienta a lesión o isquemia, intervalo PR de 0,12 a 0,20 segundos e intervalo QT variable con la frecuencia.</desc><defs><style>:root{--f:#ffffff; --p:#f1f5f9; --b:#cbd5e1; --t:#0f172a; --s:#475569;--ac:#0369a1; --al:#b91c1c; --ok:#047857; --am:#8f5700; --vi:#6d28d9;}@media (prefers-color-scheme: dark){:root{--f:#0b1220; --p:#16202f; --b:#334155; --t:#e2e8f0; --s:#94a3b8;--ac:#38bdf8; --al:#f87171; --ok:#34d399; --am:#fbbf24; --vi:#a78bfa;}}.fondo{fill:var(--f)}.t-titulo{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:26px;font-weight:700;fill:var(--t)}.t-sub{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;fill:var(--s)}.t-caja-tit{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;font-weight:700}.t-caja{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.8px;fill:var(--t)}.t-pie{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:var(--s)}.t-nota{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.8px;fill:var(--s)}.t-etq{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:var(--t)}.t-formula{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:700;fill:var(--t)}.t-formula-nota{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:var(--s)}.caja{fill:var(--p);stroke:var(--b);stroke-width:1;rx:10}.regla{stroke:var(--b);stroke-width:1}.tono-tinta{fill:var(--t)} .tono-suave{fill:var(--s)} .tono-acento{fill:var(--ac)}.tono-alerta{fill:var(--al)} .tono-ok{fill:var(--ok)} .tono-ambar{fill:var(--am)}.tono-violeta{fill:var(--vi)}.bd-tinta{stroke:var(--t)} .bd-suave{stroke:var(--s)} .bd-acento{stroke:var(--ac)}.bd-alerta{stroke:var(--al)} .bd-ok{stroke:var(--ok)} .bd-ambar{stroke:var(--am)}.bd-violeta{stroke:var(--vi)} .bd-borde{stroke:var(--b)}.fl-panel{fill:var(--p)} .fl-borde{fill:var(--b)} .fl-none{fill:none}.fl-tinta{fill:var(--t)} .fl-suave{fill:var(--s)} .fl-acento{fill:var(--ac)}.fl-alerta{fill:var(--al)} .fl-ok{fill:var(--ok)} .fl-ambar{fill:var(--am)}.fl-violeta{fill:var(--vi)}</style><marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect class="fondo" x="0" y="0" width="960" height="628"/><text class="t-titulo" x="60" y="48">Onda electrocardiográfica normal</text><text class="t-sub" x="60" y="72">Papel a 25 mm/s · cuadro grande = 0,20 s · cuadro chico = 0,04 s</text><line class="regla" x1="60" y1="84" x2="900" y2="84"/><svg x="60" y="100" width="840" height="190" viewBox="0 0 145.471 91.05" preserveAspectRatio="xMidYMid meet"><defs><clipPath clipPathUnits="userSpaceOnUse" id="k1-a"><path d="M-11.91-10.15h563.66v367.94H-11.91z"/></clipPath></defs><path d="M118.2 58.53v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v1.48h-0.28v-1.48z" fill="#fff" stroke="#fff" stroke-width=".0105832" stroke-linejoin="round"/><path d="M38.88 56.14v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v0.57h-0.28v-0.57z" fill="#fff" stroke="#fff" stroke-width=".0052916" stroke-linejoin="round"/><path d="M99.44 58.79v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v1.48h-0.28v-1.48zM77.48 59.06v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v1.48h-0.28v-1.48z" fill="#fff" stroke="#fff" stroke-width=".0105832" stroke-linejoin="round"/><path clip-path="url(#k1-a)" d="M85.67 218.87h61.76s8-42.57 19.71-42.57c11.71 0 15.43 39.74 15.43 39.74h31.94l8 47.69 28.74-233.94 30.38 240.73 10.11-43.69h86.23s22.91-67.56 28.22-69.28c5.32-2.28 12.23 0 12.23 0s9.6 11.91 26.62 68.72h5.32s12.27-14.19 25.59-14.19c13.31 0 22.87 14.19 22.87 14.19h50.57" transform="translate(-.332 -1.459) scale(.26458)" fill="none" stroke="#58d3f4" stroke-width="3.358" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(63.754 5.043) scale(.26458)" font-weight="700" font-size="26.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#87dbf5">R</tspan></tspan></text><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(57.143 75.115) scale(.26458)" font-weight="700" font-size="26.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#87dbf5">Q</tspan></tspan></text><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(106.326 38.096) scale(.26458)" font-weight="700" font-size="26.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#87dbf5">T</tspan></tspan></text><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(122.984 52.903) scale(.26458)" font-weight="700" font-size="26.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#87dbf5">U</tspan></tspan></text><path d="M9.92 2.65V66.82h-0.53V2.65zm-1.320.35L9.650.89l1.06 2.12zm2.12 63.46-1.06 2.12-1.06-2.12z" fill="#2d2d2d" stroke="#fff" stroke-width=".0052916" stroke-linejoin="round"/><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(41.542 43.648) scale(.26458)" font-weight="700" font-size="26.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#87dbf5">P</tspan></tspan></text><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(70.364 76.966) scale(.26458)" font-weight="700" font-size="26.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#87dbf5">S</tspan></tspan></text><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(-.325 4.842) scale(.26458)" font-weight="400" font-size="18.625" font-family="Arial" letter-spacing="0" word-spacing="0" fill="#2d2d2d"><tspan x="0" y="0"><tspan dx="0" dy="0">mV</tspan></tspan></text><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(10.693 13.249) scale(.26458)" font-weight="400" font-size="32" font-family="Arial" letter-spacing="0" word-spacing="0" fill="#2d2d2d"><tspan x="0" y="0"><tspan dx="0" dy="0">+</tspan></tspan></text><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(11.133 63.797) scale(.26458)" font-weight="400" font-size="32" font-family="Arial" letter-spacing="0" word-spacing="0" fill="#2d2d2d"><tspan x="0" y="0"><tspan dx="0" dy="0">-</tspan></tspan></text><path d="M48.14 56.14v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v0.57h-0.28v-0.57z" fill="#fff" stroke="#fff" stroke-width=".0052916" stroke-linejoin="round"/><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(41.807 80.731) scale(.26458)" font-weight="400" font-size="18.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#f3db63">P</tspan></tspan></text><path d="M56.07 56.14v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v2.2h-0.28v-2.2zm0 3.02v0.57h-0.28v-0.57z" fill="#fff" stroke="#fff" stroke-width=".0052916" stroke-linejoin="round"/><path d="M57.96 81.89h17.63v0.35H57.96zm0.35 1.23-2.12-1.06 2.12-1.06zm16.92-2.12 2.12 1.06-2.12 1.06z" fill="#f3db63" stroke="#f3db63" stroke-width=".0105832" stroke-linejoin="round"/><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(60.845 81.26) scale(.26458)" font-weight="400" font-size="18.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#f3db63">QRS</tspan></tspan></text><path d="M79.64 89.56h17.63v0.35H79.64zm0.35 1.23-2.12-1.06 2.12-1.06zm16.92-2.12 2.12 1.06-2.12 1.06z" fill="#f4a404" stroke="#f4a404" stroke-width=".0105832" stroke-linejoin="round"/><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(85.436 88.928) scale(.26458)" font-weight="400" font-size="18.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#f4a404">ST</tspan></tspan></text><path d="M100.79 81.63h15.52v0.35h-15.52zm0.35 1.23-2.12-1.06 2.12-1.06zm14.81-2.12 2.12 1.06-2.12 1.06z" fill="#f3db63" stroke="#f3db63" stroke-width=".0105832" stroke-linejoin="round"/><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(107.207 80.996) scale(.26458)" font-weight="400" font-size="18.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#f3db63">T</tspan></tspan></text><text xml:space="preserve" style="line-height:125%;text-align:start" transform="translate(45.068 88.708) scale(.26458)" font-weight="400" font-size="18.625" font-family="Arial" letter-spacing="0" word-spacing="0"><tspan x="0" y="0"><tspan dx="0" dy="0" fill="#f4a404">PQ</tspan></tspan></text><path d="M40.78 89.81h13.4v0.35H40.78zm0.35 1.23-2.12-1.06 2.12-1.06zm12.69-2.12 2.12 1.06-2.12 1.06z" fill="#f4a404" stroke="#f4a404" stroke-width=".0052916" stroke-linejoin="round"/></svg><text class="t-pie" x="480" y="308" text-anchor="middle">Trazo sobre el papel de registro</text><rect class="caja" x="60" y="336" width="268" height="105" rx="10"/><rect class="tono-acento" x="60" y="336" width="4" height="105" rx="2"/><text class="t-caja-tit tono-acento" x="76" y="360">Onda P</text><text class="t-caja" x="76" y="380">Despolarización auricular.</text><text class="t-caja" x="76" y="397">Precede a cada QRS cuando</text><text class="t-caja" x="76" y="414">el ritmo nace en el nodo SA.</text><rect class="caja" x="346" y="336" width="268" height="105" rx="10"/><rect class="tono-alerta" x="346" y="336" width="4" height="105" rx="2"/><text class="t-caja-tit tono-alerta" x="362" y="360">Complejo QRS</text><text class="t-caja" x="362" y="380">Despolarización ventricular.</text><text class="t-caja" x="362" y="397">Dura menos de 0,12 s si baja</text><text class="t-caja" x="362" y="414">por el sistema de conducción.</text><rect class="caja" x="632" y="336" width="268" height="105" rx="10"/><rect class="tono-violeta" x="632" y="336" width="4" height="105" rx="2"/><text class="t-caja-tit tono-violeta" x="648" y="360">Onda T</text><text class="t-caja" x="648" y="380">Repolarización ventricular.</text><text class="t-caja" x="648" y="397">Cambia de forma con la</text><text class="t-caja" x="648" y="414">isquemia y con el potasio.</text><rect class="caja" x="60" y="459" width="268" height="105" rx="10"/><rect class="tono-ambar" x="60" y="459" width="4" height="105" rx="2"/><text class="t-caja-tit tono-ambar" x="76" y="483">Segmento ST</text><text class="t-caja" x="76" y="503">Referencia isoeléctrica. Su</text><text class="t-caja" x="76" y="520">elevación o descenso orienta</text><text class="t-caja" x="76" y="537">a lesión o isquemia.</text><rect class="caja" x="346" y="459" width="268" height="105" rx="10"/><rect class="tono-ok" x="346" y="459" width="4" height="105" rx="2"/><text class="t-caja-tit tono-ok" x="362" y="483">Intervalo PR</text><text class="t-caja" x="362" y="503">0,12–0,20 s. Es el retraso</text><text class="t-caja" x="362" y="520">que introduce el nodo AV.</text><rect class="caja" x="632" y="459" width="268" height="105" rx="10"/><rect class="tono-suave" x="632" y="459" width="4" height="105" rx="2"/><text class="t-caja-tit tono-suave" x="648" y="483">Intervalo QT</text><text class="t-caja" x="648" y="503">Varía con la frecuencia; se</text><text class="t-caja" x="648" y="520">corrige antes de interpretarlo.</text><line class="regla" x1="60" y1="572" x2="900" y2="572"/><text class="t-nota" x="60" y="594">El trazo se lee siempre en el mismo orden: ¿hay onda P?, ¿cada P lleva su QRS?, ¿el QRS es estrecho?, ¿el intervalo es regular? Solo</text><text class="t-nota" x="60" y="610">después se busca la alteración.</text></svg>
