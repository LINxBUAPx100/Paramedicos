<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 638" width="960" height="638" role="img"><title>Curva de disociación de la oxihemoglobina</title><desc>Gráfica con la presión parcial de oxígeno en el eje horizontal, de 0 a 100 milímetros de mercurio, y la saturación de la hemoglobina en el eje vertical, de 0 a 100 por ciento. La curva tiene forma de S: sube muy poco entre 0 y 20 milímetros de mercurio, sube con rapidez entre 20 y 60, y se aplana por encima de 60, donde la saturación ya supera el 90 por ciento. El punto P50 está en torno a 26,6 milímetros de mercurio con saturación del 50 por ciento. Dos fichas explican el desplazamiento a la derecha, que suelta más oxígeno al tejido con aumento de dióxido de carbono, de temperatura y de 2,3-DPG y descenso del pH, y el desplazamiento a la izquierda, que retiene el oxígeno en las condiciones opuestas.</desc><defs><style>:root{--f:#ffffff; --p:#f1f5f9; --b:#cbd5e1; --t:#0f172a; --s:#475569;--ac:#0369a1; --al:#b91c1c; --ok:#047857; --am:#8f5700; --vi:#6d28d9;}@media (prefers-color-scheme: dark){:root{--f:#0b1220; --p:#16202f; --b:#334155; --t:#e2e8f0; --s:#94a3b8;--ac:#38bdf8; --al:#f87171; --ok:#34d399; --am:#fbbf24; --vi:#a78bfa;}}.fondo{fill:var(--f)}.t-titulo{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:26px;font-weight:700;fill:var(--t)}.t-sub{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;fill:var(--s)}.t-caja-tit{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;font-weight:700}.t-caja{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.8px;fill:var(--t)}.t-pie{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:var(--s)}.t-nota{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.8px;fill:var(--s)}.t-etq{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:var(--t)}.t-formula{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:700;fill:var(--t)}.t-formula-nota{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:var(--s)}.caja{fill:var(--p);stroke:var(--b);stroke-width:1;rx:10}.regla{stroke:var(--b);stroke-width:1}.tono-tinta{fill:var(--t)} .tono-suave{fill:var(--s)} .tono-acento{fill:var(--ac)}.tono-alerta{fill:var(--al)} .tono-ok{fill:var(--ok)} .tono-ambar{fill:var(--am)}.tono-violeta{fill:var(--vi)}.bd-tinta{stroke:var(--t)} .bd-suave{stroke:var(--s)} .bd-acento{stroke:var(--ac)}.bd-alerta{stroke:var(--al)} .bd-ok{stroke:var(--ok)} .bd-ambar{stroke:var(--am)}.bd-violeta{stroke:var(--vi)} .bd-borde{stroke:var(--b)}.fl-panel{fill:var(--p)} .fl-borde{fill:var(--b)} .fl-none{fill:none}.fl-tinta{fill:var(--t)} .fl-suave{fill:var(--s)} .fl-acento{fill:var(--ac)}.fl-alerta{fill:var(--al)} .fl-ok{fill:var(--ok)} .fl-ambar{fill:var(--am)}.fl-violeta{fill:var(--vi)}</style><marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect class="fondo" x="0" y="0" width="960" height="638"/><text class="t-titulo" x="60" y="48">Curva de disociación de la oxihemoglobina</text><text class="t-sub" x="60" y="72">Relación entre la PaO₂ y la saturación de la hemoglobina</text><line class="regla" x1="60" y1="84" x2="900" y2="84"/><path class="fl-none bd-borde" fill-rule="evenodd" d="M120 400 H600" stroke-width="1.5"/><path class="fl-none bd-borde" fill-rule="evenodd" d="M120 400 V116" stroke-width="1.5"/><path class="fl-none bd-borde" fill-rule="evenodd" d="M120 148 H600" stroke-width="0.8" stroke-dasharray="5 4"/><path class="fl-none bd-borde" fill-rule="evenodd" d="M408 400 V148" stroke-width="0.8" stroke-dasharray="5 4"/><path class="fl-none bd-acento" fill-rule="evenodd" d="M120 398 C 168 392, 196 372, 220 330 C 244 288, 264 236, 300 196 C 340 154, 400 138, 456 132 C 512 126, 560 124, 600 123" stroke-width="3"/><path class="fl-none bd-borde" fill-rule="evenodd" d="M120 264 H247" stroke-width="0.8" stroke-dasharray="5 4"/><path class="fl-none bd-borde" fill-rule="evenodd" d="M247 400 V264" stroke-width="0.8" stroke-dasharray="5 4"/><path class="fl-none bd-alerta" fill-rule="evenodd" d="M262 300 h34" stroke-width="2" marker-end="url(#punta)"/><path class="fl-none bd-violeta" fill-rule="evenodd" d="M232 300 h-34" stroke-width="2" marker-end="url(#punta)"/><svg x="660" y="150" width="130" height="130" viewBox="0 0 98.419 95.395" preserveAspectRatio="xMidYMid meet"><defs><clipPath clipPathUnits="userSpaceOnUse" id="k1-a"><path d="M1.04 3.28H99.3V98.74H1.04z"/></clipPath></defs><path clip-path="url(#k1-a)" d="M28.02 18.79C16.19 26.54 6.24 33.46 3.56 47.33c-1.92 11.39-1.52 24.03 5.76 34.22 16.03 22.83 54.29 20.39 75.67-5.68C106.38 49.77 97.98 17.15 79.63 8.2c-17.95-6.56-27.14-3.28-51.61 10.59z" fill="#f5765d" fill-rule="evenodd"/><path clip-path="url(#k1-a)" d="M79.27 10.19c-6.52-2.04-11.47-3.28-16.83-2.84 4.2 0 8.04 1.2 13.03 2.84 17.59 8.55 25.27 39.94 4.96 64.4-10.35 13.03-25.26 19.95-39.46 20.35 14.950.4 31.78-6.12 43.29-20.35 20.27-24.46 12.23-55.85-5-64.4z" fill="#f44d32" fill-rule="evenodd"/><path d="M14.27 79.95c-6.88-10.19-7.28-22.03-5.36-32.62 2.68-12.63 11.87-19.55 23.34-26.46C45.65 12.71 54.45 8.63 62.48 7.4c-9.55 0-18.35 4.52-34.06 13.47C17.35 27.78 7.76 34.7 5.48 47.33c-2.32 11.03-1.52 22.83 5.36 32.62 7.64 10.99 20.67 15.87 34.46 14.67-12.27 0-23.75-4.88-31.02-14.67z" fill="#f9bba6" fill-rule="evenodd"/><path d="M58.6 25.3c23.710.84 22.95 30.62-2.28 43.65-25.23 13.03-35.58-4.08-34.78-14.670.76-13.87 22.95-28.54 37.06-28.98z" fill="#f44d32" fill-rule="evenodd"/><path d="M70.12 29.3c6.52 9.79 1.16 26.94-16.87 36.34-13.39 6.92-22.55 5.28-27.940.8 5 6.92 14.95 10.99 31.02 2.44 20.31-10.19 24.87-30.98 13.79-39.58zM49.85 26.5c-9.95 2.04-22.59 12.27-25.66 19.99 5-5.28 16.11-15.87 25.66-19.99z" fill="#e12a19" fill-rule="evenodd"/><path d="M40.26 74.64c7.670.8 35.94-9.79 36.34-33.1 1.88 9.83-9.55 33.9-36.34 33.1z" fill="#fefefe" fill-rule="evenodd"/><path clip-path="url(#k1-a)" d="M28.06 18.83C16.23 26.58 6.28 33.5 3.6 47.37c-1.92 11.39-1.52 24.03 5.76 34.22 16.03 22.83 54.29 20.39 75.67-5.68C106.42 49.81 98.02 17.19 79.67 8.23c-17.95-6.56-27.14-3.28-51.61 10.59" fill="none" stroke="#333" stroke-width="1.679" stroke-linecap="round" stroke-linejoin="round"/><path d="M58.64 25.3c9.20.44 14.91 5.32 16.43 13.07 1.92 8.95-3.04 21.99-18.71 30.14-14.15 7.32-22.59 4.88-27.18 1.6-5.36-4.04-8.04-10.99-7.63-15.87-0.4 5.28 1.52 12.23 7.28 16.31 4.96 3.64 13.39 6.08 27.9-1.24 15.71-8.15 21.03-21.99 19.15-31.38-1.56-7.71-8.04-12.19-17.23-12.63z" fill="#333" fill-rule="evenodd"/></svg><text class="t-pie" x="725" y="298" text-anchor="middle">La hemoglobina viaja aquí</text><rect class="caja" x="60" y="462" width="408" height="112" rx="10"/><rect class="tono-alerta" x="60" y="462" width="4" height="112" rx="2"/><text class="t-caja-tit tono-alerta" x="76" y="486">Derecha · suelta más O₂ al tejido</text><text class="t-caja" x="76" y="506">↑ CO₂ · ↑ temperatura · ↑ 2,3-DPG · ↓ pH (acidosis).</text><text class="t-caja" x="76" y="523">Es el efecto Bohr: el tejido que trabaja y se acidifica hace</text><text class="t-caja" x="76" y="540">que la hemoglobina entregue más oxígeno donde hace falta.</text><rect class="caja" x="492" y="462" width="408" height="112" rx="10"/><rect class="tono-violeta" x="492" y="462" width="4" height="112" rx="2"/><text class="t-caja-tit tono-violeta" x="508" y="486">Izquierda · retiene el O₂</text><text class="t-caja" x="508" y="506">↓ CO₂ · ↓ temperatura · ↓ 2,3-DPG · ↑ pH (alcalosis).</text><text class="t-caja" x="508" y="523">La capta bien en el pulmón pero la suelta peor en el tejido:</text><text class="t-caja" x="508" y="540">hipotermia e hiperventilación juegan en contra.</text><text class="t-etq tono-suave" x="112" y="404" text-anchor="end" style="font-size:11.5px">0</text><text class="t-etq tono-suave" x="112" y="340" text-anchor="end" style="font-size:11.5px">20</text><text class="t-etq tono-suave" x="112" y="268" text-anchor="end" style="font-size:11.5px">50</text><text class="t-etq tono-suave" x="112" y="196" text-anchor="end" style="font-size:11.5px">80</text><text class="t-etq tono-suave" x="112" y="152" text-anchor="end" style="font-size:11.5px">90</text><text class="t-etq tono-suave" x="112" y="122" text-anchor="end" style="font-size:11.5px">100</text><text class="t-etq tono-suave" x="74" y="268" style="font-size:12px;font-weight:700" transform="rotate(-90 74 268)">Sat. Hb (%)</text><text class="t-etq tono-suave" x="120" y="420" text-anchor="middle" style="font-size:11.5px">0</text><text class="t-etq tono-suave" x="216" y="420" text-anchor="middle" style="font-size:11.5px">20</text><text class="t-etq tono-suave" x="312" y="420" text-anchor="middle" style="font-size:11.5px">40</text><text class="t-etq tono-suave" x="408" y="420" text-anchor="middle" style="font-size:11.5px">60</text><text class="t-etq tono-suave" x="504" y="420" text-anchor="middle" style="font-size:11.5px">80</text><text class="t-etq tono-suave" x="600" y="420" text-anchor="middle" style="font-size:11.5px">100</text><text class="t-etq tono-suave" x="360" y="442" text-anchor="middle" style="font-size:12px;font-weight:700">Presión parcial de oxígeno · PaO₂ (mmHg)</text><text class="t-etq tono-tinta" x="256" y="258" style="font-size:11.5px;font-weight:700">P50 ≈ 26,6 mmHg (Sat. 50 %)</text><text class="t-etq tono-alerta" x="300" y="304" style="font-size:11.5px;font-weight:700">derecha</text><text class="t-etq tono-violeta" x="194" y="304" text-anchor="end" style="font-size:11.5px;font-weight:700">izquierda</text><text class="t-etq tono-suave" x="420" y="140" style="font-size:11.5px">Meseta: por encima de 60 mmHg la saturación ya pasa de 90 %</text><text class="t-etq tono-suave" x="250" y="210" style="font-size:11.5px">Zona empinada: aquí un cambio pequeño de PaO₂</text><text class="t-etq tono-suave" x="250" y="226" style="font-size:11.5px">mueve mucho la saturación</text><line class="regla" x1="60" y1="582" x2="900" y2="582"/><text class="t-nota" x="60" y="604">La meseta explica por qué la oximetría engaña: entre 100 y 70 mmHg de PaO₂ la saturación baja poco, así que un 92 % puede</text><text class="t-nota" x="60" y="620">corresponder ya a una PaO₂ claramente baja. Por debajo de ese punto la curva cae en picado.</text></svg>
