<svg xmlns="http://www.w3.org/2000/svg" width="960" height="638" style="--f:#ffffff;--p:#f1f5f9;--b:#cbd5e1;--t:#0f172a;--s:#475569;--ac:#0369a1;--al:#b91c1c;--ok:#047857;--am:#8f5700;--vi:#6d28d9" viewBox="0 0 960 638"><title>Curva de disociación de la oxihemoglobina</title><desc>Gráfica con la presión parcial de oxígeno en el eje horizontal, de 0 a 100 milímetros de mercurio, y la saturación de la hemoglobina en el eje vertical, de 0 a 100 por ciento. La curva tiene forma de S: sube muy poco entre 0 y 20 milímetros de mercurio, sube con rapidez entre 20 y 60, y se aplana por encima de 60, donde la saturación ya supera el 90 por ciento. El punto P50 está en torno a 26,6 milímetros de mercurio con saturación del 50 por ciento. Dos fichas explican el desplazamiento a la derecha, que suelta más oxígeno al tejido con aumento de dióxido de carbono, de temperatura y de 2,3-DPG y descenso del pH, y el desplazamiento a la izquierda, que retiene el oxígeno en las condiciones opuestas.</desc><defs><marker id="punta" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="context-stroke" d="m0 0 10 5-10 5z"/></marker><style>@media (prefers-color-scheme:dark){:root{--f:#0b1220;--p:#16202f;--b:#334155;--t:#e2e8f0;--s:#94a3b8;--ac:#38bdf8;--al:#f87171;--ok:#34d399;--am:#fbbf24;--vi:#a78bfa}}.t-caja,.t-caja-tit,.t-etq,.t-nota{font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.t-caja-tit{font-size:14.5px;font-weight:700}.t-caja,.t-nota{font-size:12.8px;fill:var(--t)}.t-nota{fill:var(--s)}.t-etq{font-size:12.5px;fill:var(--t)}.caja{fill:var(--p);rx:10}.caja,.regla{stroke:var(--b);stroke-width:1}.tono-suave{fill:var(--s)}.tono-alerta{fill:var(--al)}.tono-violeta{fill:var(--vi)}.bd-borde{stroke:var(--b)}.fl-none{fill:none}</style></defs><path d="M0 0h960v638H0z" style="fill:var(--f)"/><text x="60" y="48" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:26px;font-weight:700;fill:var(--t)">Curva de disociación de la oxihemoglobina</text><text x="60" y="72" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:14.5px;fill:var(--s)">Relación entre la PaO₂ y la saturación de la hemoglobina</text><path d="M60 84h840" class="regla"/><path fill-rule="evenodd" stroke-width="1.5" d="M120 400h480m-480 0V116" class="fl-none bd-borde"/><path fill-rule="evenodd" stroke-dasharray="5 4" stroke-width=".8" d="M120 148h480M408 400V148" class="fl-none bd-borde"/><path fill-rule="evenodd" stroke-width="3" d="M120 398c48-6 76-26 100-68s44-94 80-134c40-42 100-58 156-64s104-8 144-9" class="fl-none" style="stroke:var(--ac)"/><path fill-rule="evenodd" stroke-dasharray="5 4" stroke-width=".8" d="M120 264h127m0 136V264" class="fl-none bd-borde"/><path fill-rule="evenodd" stroke-width="2" marker-end="url(#punta)" d="M262 300h34" class="fl-none" style="stroke:var(--al)"/><path fill-rule="evenodd" stroke-width="2" marker-end="url(#punta)" d="M232 300h-34" class="fl-none" style="stroke:var(--vi)"/><svg width="130" height="130" x="660" y="150" viewBox="0 0 98.419 95.395"><defs><clipPath id="k1-a" clipPathUnits="userSpaceOnUse"><path d="M1.04 3.28H99.3v95.46H1.04z"/></clipPath></defs><path fill="#f5765d" fill-rule="evenodd" d="M28.02 18.79C16.19 26.54 6.24 33.46 3.56 47.33 1.64 58.72 2.04 71.36 9.32 81.55c16.03 22.83 54.29 20.39 75.67-5.68 21.39-26.1 12.99-58.72-5.36-67.67-17.95-6.56-27.14-3.28-51.61 10.59" clip-path="url(#k1-a)"/><path fill="#f44d32" fill-rule="evenodd" d="M79.27 10.19C72.75 8.15 67.8 6.91 62.44 7.35c4.2 0 8.04 1.2 13.03 2.84 17.59 8.55 25.27 39.94 4.96 64.4-10.35 13.03-25.26 19.95-39.46 20.35 14.95.4 31.78-6.12 43.29-20.35 20.27-24.46 12.23-55.85-5-64.4z" clip-path="url(#k1-a)"/><path fill="#f9bba6" fill-rule="evenodd" d="M14.27 79.95C7.39 69.76 6.99 57.92 8.91 47.33c2.68-12.63 11.87-19.55 23.34-26.46 13.4-8.16 22.2-12.24 30.23-13.47-9.55 0-18.35 4.52-34.06 13.47C17.35 27.78 7.76 34.7 5.48 47.33c-2.32 11.03-1.52 22.83 5.36 32.62 7.64 10.99 20.67 15.87 34.46 14.67-12.27 0-23.75-4.88-31.02-14.67z"/><path fill="#f44d32" fill-rule="evenodd" d="M58.6 25.3c23.71.84 22.95 30.62-2.28 43.65s-35.58-4.08-34.78-14.67C22.3 40.41 44.49 25.74 58.6 25.3"/><path fill="#e12a19" fill-rule="evenodd" d="M70.12 29.3c6.52 9.79 1.16 26.94-16.87 36.34-13.39 6.92-22.55 5.28-27.94.8 5 6.92 14.95 10.99 31.02 2.44C76.64 58.69 81.2 37.9 70.12 29.3m-20.27-2.8c-9.95 2.04-22.59 12.27-25.66 19.99 5-5.28 16.11-15.87 25.66-19.99"/><path fill="#fefefe" fill-rule="evenodd" d="M40.26 74.64c7.67.8 35.94-9.79 36.34-33.1 1.88 9.83-9.55 33.9-36.34 33.1"/><path fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.679" d="M28.06 18.83C16.23 26.58 6.28 33.5 3.6 47.37 1.68 58.76 2.08 71.4 9.36 81.59c16.03 22.83 54.29 20.39 75.67-5.68 21.39-26.1 12.99-58.72-5.36-67.68-17.95-6.56-27.14-3.28-51.61 10.59" clip-path="url(#k1-a)"/><path fill="#333" fill-rule="evenodd" d="M58.64 25.3c9.2.44 14.91 5.32 16.43 13.07 1.92 8.95-3.04 21.99-18.71 30.14-14.15 7.32-22.59 4.88-27.18 1.6-5.36-4.04-8.04-10.99-7.63-15.87-.4 5.28 1.52 12.23 7.28 16.31 4.96 3.64 13.39 6.08 27.9-1.24 15.71-8.15 21.03-21.99 19.15-31.38-1.56-7.71-8.04-12.19-17.23-12.63z"/></svg><text x="725" y="298" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:12.5px;fill:var(--s)" text-anchor="middle">La hemoglobina viaja aquí</text><rect width="408" height="112" x="60" y="462" class="caja" rx="10"/><rect width="4" height="112" x="60" y="462" class="tono-alerta" rx="2"/><text x="76" y="486" class="t-caja-tit tono-alerta">Derecha · suelta más O₂ al tejido</text><text x="76" y="506" class="t-caja">↑ CO₂ · ↑ temperatura · ↑ 2,3-DPG · ↓ pH (acidosis).</text><text x="76" y="523" class="t-caja">Es el efecto Bohr: el tejido que trabaja y se acidifica hace</text><text x="76" y="540" class="t-caja">que la hemoglobina entregue más oxígeno donde hace falta.</text><rect width="408" height="112" x="492" y="462" class="caja" rx="10"/><rect width="4" height="112" x="492" y="462" class="tono-violeta" rx="2"/><text x="508" y="486" class="t-caja-tit tono-violeta">Izquierda · retiene el O₂</text><text x="508" y="506" class="t-caja">↓ CO₂ · ↓ temperatura · ↓ 2,3-DPG · ↑ pH (alcalosis).</text><text x="508" y="523" class="t-caja">La capta bien en el pulmón pero la suelta peor en el tejido:</text><text x="508" y="540" class="t-caja">hipotermia e hiperventilación juegan en contra.</text><text x="112" y="404" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="end">0</text><text x="112" y="340" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="end">20</text><text x="112" y="268" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="end">50</text><text x="112" y="196" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="end">80</text><text x="112" y="152" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="end">90</text><text x="112" y="122" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="end">100</text><text x="74" y="268" class="t-etq tono-suave" style="font-size:12px;font-weight:700" transform="rotate(-90 74 268)">Sat. Hb (%)</text><text x="120" y="420" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="middle">0</text><text x="216" y="420" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="middle">20</text><text x="312" y="420" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="middle">40</text><text x="408" y="420" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="middle">60</text><text x="504" y="420" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="middle">80</text><text x="600" y="420" class="t-etq tono-suave" style="font-size:11.5px" text-anchor="middle">100</text><text x="360" y="442" class="t-etq tono-suave" style="font-size:12px;font-weight:700" text-anchor="middle">Presión parcial de oxígeno · PaO₂ (mmHg)</text><text x="256" y="258" class="t-etq" style="fill:var(--t);font-size:11.5px;font-weight:700">P50 ≈ 26,6 mmHg (Sat. 50 %)</text><text x="300" y="304" class="t-etq tono-alerta" style="font-size:11.5px;font-weight:700">derecha</text><text x="194" y="304" class="t-etq tono-violeta" style="font-size:11.5px;font-weight:700" text-anchor="end">izquierda</text><text x="420" y="140" class="t-etq tono-suave" style="font-size:11.5px">Meseta: por encima de 60 mmHg la saturación ya pasa de 90 %</text><text x="250" y="210" class="t-etq tono-suave" style="font-size:11.5px">Zona empinada: aquí un cambio pequeño de PaO₂</text><text x="250" y="226" class="t-etq tono-suave" style="font-size:11.5px">mueve mucho la saturación</text><path d="M60 582h840" class="regla"/><text x="60" y="604" class="t-nota">La meseta explica por qué la oximetría engaña: entre 100 y 70 mmHg de PaO₂ la saturación baja poco, así que un 92 % puede</text><text x="60" y="620" class="t-nota">corresponder ya a una PaO₂ claramente baja. Por debajo de ese punto la curva cae en picado.</text></svg>