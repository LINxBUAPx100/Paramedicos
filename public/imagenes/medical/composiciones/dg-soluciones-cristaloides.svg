.74 0 2.38-20.99 9.05-20.99 7.1 0 11.41 15.11 16.93 15.11M82.57 75.31c3.94 5.04-.78 11.75 2.36 14.69 3.56 2.52 11.03-6.71 17.33-5.46" clip-path="url(#k3-a)"/><path fill="none" stroke="#ef9e7e" stroke-linecap="round" stroke-linejoin="round" stroke-width=".8" d="M97.14 49.27c.78-.84 1.96-2.1 2.74-2.94-1.96-.42-3.14 0-4.72.42m-12.59 30.6c1.58-.42 2.76-1.26 3.94-1.68m-24.41-6.7c1.18.84 3.16 1.68 4.72 2.1m4.74 37.72c1.56-.42 2.74-2.1 4.72-2.1 0 2.94-1.18 2.94-3.16 2.94m12.99-49.05c-.78 2.1-1.18 4.2-1.58 5.88m42.91-8.81c0-.84.78-1.26 1.56-1.66v5.02m-6.68-25.98c-.8 1.26-1.58 2.1-1.98 3.36m-23.6 59.93c-.4-.42-.8-.84-1.18-1.68M63.68 24.1v3.78m-5.92 94.32s.4-.82.4-1.24"/></svg><text x="770" y="272" class="t-pie" text-anchor="middle">Hipertónico</text><rect width="266.667" height="190" x="60" y="300" class="caja" rx="10"/><rect width="4" height="190" x="60" y="300" class="tono-ok" rx="2"/><text x="76" y="324" class="t-caja-tit tono-ok">Isotónico</text><text x="76" y="344" class="t-caja">Misma osmolaridad que el</text><text x="76" y="361" class="t-caja">plasma: el agua no se mueve</text><text x="76" y="378" class="t-caja">en ningún sentido.</text><text x="76" y="403" class="t-caja">Es lo que se busca cuando</text><text x="76" y="420" class="t-caja">hay que reponer volumen</text><text x="76" y="437" class="t-caja">en el espacio vascular.</text><rect width="266.667" height="190" x="346.667" y="300" class="caja" rx="10"/><rect width="4" height="190" x="346.667" y="300" class="tono-acento" rx="2"/><text x="362.667" y="324" class="t-caja-tit tono-acento">Hipotónico</text><text x="362.667" y="344" class="t-caja">Menor osmolaridad: el agua</text><text x="362.667" y="361" class="t-caja">entra en la célula.</text><text x="362.667" y="386" class="t-caja">La célula se hincha y puede</text><text x="362.667" y="403" class="t-caja">romperse. En el cerebro,</text><text x="362.667" y="420" class="t-caja">eso significa edema.</text><rect width="266.667" height="190" x="633.333" y="300" class="caja" rx="10"/><rect width="4" height="190" x="633.333" y="300" class="tono-ambar" rx="2"/><text x="649.333" y="324" class="t-caja-tit tono-ambar">Hipertónico</text><text x="649.333" y="344" class="t-caja">Mayor osmolaridad: el agua</text><text x="649.333" y="361" class="t-caja">sale de la célula.</text><text x="649.333" y="386" class="t-caja">La célula se arruga. Se usa</text><text x="649.333" y="403" class="t-caja">en indicaciones concretas y</text><text x="649.333" y="420" class="t-caja">bajo protocolo.</text><path d="M60 504h840" class="regla"/><text x="60" y="526" class="t-nota">Esta figura explica el mecanismo osmótico, no una indicación. Qué solución se administra, a qué volumen y a qué ritmo depende del</text><text x="60" y="542" class="t-nota">cuadro, del peso y del protocolo del servicio, no del tipo de solución en abstracto.</text></svg>