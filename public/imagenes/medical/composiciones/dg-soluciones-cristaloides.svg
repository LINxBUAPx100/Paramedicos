<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" style="--f:#ffffff;--p:#f1f5f9;--b:#cbd5e1;--t:#0f172a;--s:#475569;--ac:#0369a1;--al:#b91c1c;--ok:#047857;--am:#8f5700;--vi:#6d28d9" viewBox="0 0 960 560"><title>Osmolaridad de las soluciones</title><desc>Tres figuras del mismo eritrocito en tres medios distintos: en medio isotónico conserva su forma; en medio hipotónico ha captado agua y se ha vuelto esférico, próximo a la hemólisis; en medio hipertónico ha perdido agua y muestra la superficie festoneada de la crenación. Debajo, tres fichas explican el movimiento del agua en cada caso y por qué la solución de reposición prehospitalaria es isotónica.</desc><defs><marker id="punta" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="context-stroke" d="m0 0 10 5-10 5z"/></marker><style>@media (prefers-color-scheme:dark){:root{--f:#0b1220;--p:#16202f;--b:#334155;--t:#e2e8f0;--s:#94a3b8;--ac:#38bdf8;--al:#f87171;--ok:#34d399;--am:#fbbf24;--vi:#a78bfa}}.t-caja,.t-caja-tit,.t-nota,.t-pie{font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.t-caja-tit{font-size:14.5px;font-weight:700}.t-caja{font-size:12.8px;fill:var(--t)}.t-nota,.t-pie{fill:var(--s)}.t-pie{font-size:12.5px}.t-nota{font-size:12.8px}.caja{fill:var(--p);rx:10}.caja,.regla{stroke:var(--b);stroke-width:1}.tono-acento{fill:var(--ac)}.tono-ok{fill:var(--ok)}.tono-ambar{fill:var(--am)}</style></defs><path d="M0 0h960v560H0z" style="fill:var(--f)"/><text x="60" y="48" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:26px;font-weight:700;fill:var(--t)">Osmolaridad de las soluciones</text><text x="60" y="72" style="font-family:&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-size:14.5px;fill:var(--s)">Qué le hace cada tipo de solución a la célula que la recibe</text><path d="M60 84h840" class="regla"/><svg width="260" height="150" x="